<html lang="es">
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>

    --green-mid: #9FE1CB;
    --green-dark: #0F6E56;
    --bg: #ffffff;
    --bg2: #f4f4f2;
    --bg3: #ebebea;
    --text: #1a1a1a;
    --text2: #6b6b68;
    --text3: #a0a09d;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --bg2: #242422; --bg3: #2e2e2c;
      --text: #f0f0ee; --text2: #a0a09d; --text3: #686865;

    }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .app { max-width: 720px; margin: 0 auto; padding: 0 1rem 4rem; }
  .header { padding: 1.5rem 0 1rem; text-align: center; border-bottom: 0.5px solid var(--border); margin-bottom: 1.5rem; }
  .header h1 { font-size: 26px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .header h1 i { color: var(--green); font-size: 26px; }
  .header p { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .stats-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1rem; }
  .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-num.green { color: var(--green); }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .progress-bar { height: 6px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .4s; }
  .progress-label { font-size: 11px; color: var(--text3); text-align: right; margin-bottom: 1.25rem; }
  .controls { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .controls input, .controls select {
    border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 8px 12px;
    font-size: 14px; background: var(--bg); color: var(--text); outline: none;
  }
  .controls input { flex: 1; min-width: 140px; }
  .controls input:focus, .controls select:focus { border-color: var(--green); }
  .tab-row { display: flex; gap: 4px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--text2); transition: all .15s; }
  .tab.active { background: var(--bg2); color: var(--text); font-weight: 500; border-color: var(--border2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: border-color .15s, transform .1s; }
  .card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .card.tried { border-color: var(--green); border-width: 1.5px; }
  .card-img { width: 100%; height: 100px; object-fit: cover; display: block; }
  .card-placeholder { width: 100%; height: 100px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .card-body { padding: 8px 10px; }
  .card-num { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .card-name { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }
  .badge-indica { background: #CECBF6; color: #3C3489; }
  .badge-sativa { background: #C0DD97; color: #3B6D11; }
  .badge-hibrida { background: #FAC775; color: #633806; }
  .card-check { display: flex; align-items: center; gap: 4px; margin-top: 5px; font-size: 10px; color: var(--text2); }
  .dot-green { width: 13px; height: 13px; border-radius: 50%; background: var(--green); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dot-green i { font-size: 8px; color: #fff; }
  /* Modal */
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-start; justify-content: center; padding: 2rem 1rem; z-index: 100; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); width: 100%; max-width: 460px; overflow: hidden; margin: auto; }
  .modal-header { padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { font-size: 16px; font-weight: 500; }
  .modal-close { background: transparent; border: none; cursor: pointer; color: var(--text2); font-size: 20px; line-height: 1; padding: 2px; }
  .modal-body { padding: 1.25rem; }
  .modal-img { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius); margin-bottom: 1rem; display: block; }
  .modal-placeholder { width: 100%; height: 180px; background: var(--bg2); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 1rem; }
  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .tag-thc { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }
  .tag-tried { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--green-light); color: var(--green-dark); border: 0.5px solid var(--green-mid); }
  .modal-desc { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 1rem; }
  .section-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .effects { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 1rem; }
  .effect { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }
  .upload-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 0.5px dashed var(--border2); border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text2); background: transparent; width: 100%; justify-content: center; margin-bottom: 1rem; transition: all .15s; }
  .upload-btn:hover { border-color: var(--green); color: var(--green); }
  .rating-row { display: flex; gap: 6px; align-items: center; margin-bottom: 1rem; }
  .rating-row label { font-size: 12px; color: var(--text2); }
  .star { font-size: 20px; cursor: pointer; opacity: 0.2; transition: opacity .1s; }
  .star.on { opacity: 1; }
  .notes-label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }
  textarea { width: 100%; font-size: 13px; padding: 8px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); resize: vertical; min-height: 70px; background: var(--bg); color: var(--text); font-family: inherit; outline: none; margin-bottom: 1rem; }
  textarea:focus { border-color: var(--green); }
  .modal-actions { display: flex; gap: 8px; }
  .btn-primary { flex: 1; padding: 10px; border-radius: var(--radius); border: 1.5px solid var(--green); background: transparent; color: var(--green); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .btn-primary:hover { background: var(--green); color: #fff; }
  .btn-primary.untry { border-color: var(--border2); color: var(--text2); }
  .btn-primary.untry:hover { background: var(--bg2); color: var(--text); }
  .btn-sec { padding: 10px 18px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; }
  .btn-sec:hover { background: var(--bg2); }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
  @media(max-width:480px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .header h1{font-size:22px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><i class="ti ti-leaf"></i> Weedex</h1>
    <p>Tu pokédex personal de cepas de cannabis</p>
  </div>

  <div class="controls">

      <option value="Índica">Índica</option>
      <option value="Sativa">Sativa</option>
      <option value="Híbrida">Híbrida</option>
    </select>
  </div>
  <div class="tab-row">
    <button class="tab active" onclick="setTab(this,'all')">Todas</button>
    <button class="tab" onclick="setTab(this,'tried')">Probadas</button>
    <button class="tab" onclick="setTab(this,'untried')">Por probar</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No se encontraron cepas.</div>
</div>

<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">

let userData={},currentStrain=null,currentTab='all',currentSearch='',currentType='',pendingPhoto=null;
function load(){try{const s=localStorage.getItem('weedex_v2');if(s)userData=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem('weedex_v2',JSON.stringify(userData));}catch(e){}}
load();

function badgeClass(t){return t==='Índica'?'badge-indica':t==='Sativa'?'badge-sativa':'badge-hibrida';}

function renderStats(){
  const tried=STRAINS.filter(s=>userData[s.id]?.tried).length,total=STRAINS.length,pct=Math.round(tried/total*100);
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total cepas</div></div>
    <div class="stat-card"><div class="stat-num green">${tried}</div><div class="stat-label">Probadas</div></div>
    <div class="stat-card"><div class="stat-num">${total-tried}</div><div class="stat-label">Por probar</div></div>`;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=pct+'% del Weedex completado';
}

function filtered(){
  return STRAINS.filter(s=>{
    const tried=!!(userData[s.id]?.tried);
    if(currentTab==='tried'&&!tried)return false;
    if(currentTab==='untried'&&tried)return false;
    if(currentType&&s.type!==currentType)return false;
    if(currentSearch){const q=currentSearch.toLowerCase();if(!s.name.toLowerCase().includes(q)&&!s.type.toLowerCase().includes(q)&&!s.effects.join(' ').toLowerCase().includes(q)&&!s.desc.toLowerCase().includes(q))return false;}
    return true;
  });
}

function renderGrid(){
  renderStats();
  const list=filtered(),grid=document.getElementById('grid'),empty=document.getElementById('empty');
  if(!list.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=list.map(s=>{
    const u=userData[s.id]||{},tried=!!u.tried,stars=u.rating||0;
    const img=u.photo?`<img src="${u.photo}" class="card-img" alt="${s.name}" loading="lazy">`:`<div class="card-placeholder">${s.emoji}</div>`;
    return `<div class="card${tried?' tried':''}" onclick="openModal(${s.id})">
      ${img}
      <div class="card-body">
        <div class="card-num">#${String(s.id).padStart(3,'0')}</div>
        <div class="card-name">${s.name}</div>
        <span class="badge ${badgeClass(s.type)}">${s.type}</span>
        ${stars?`<div style="font-size:10px;margin-top:3px">${'⭐'.repeat(stars)}</div>`:''}
        <div class="card-check">
          ${tried?`<span class="dot-green"><i class="ti ti-check"></i></span> Probada`:`<i class="ti ti-circle-dashed" style="font-size:11px"></i> Sin probar`}
        </div>
      </div></div>`;
  }).join('');
}

function openModal(id){
  currentStrain=STRAINS.find(s=>s.id===id);pendingPhoto=null;
  document.getElementById('modalTitle').textContent=`#${String(id).padStart(3,'0')} ${currentStrain.name}`;
  renderModalBody(currentStrain,userData[id]||{});
  document.getElementById('overlay').classList.add('open');
}

function renderModalBody(s,u){
  const tried=!!u.tried,stars=u.rating||0;
  const img=u.photo?`<img src="${u.photo}" class="modal-img" alt="${s.name}">`:`<div class="modal-placeholder">${s.emoji}</div>`;
  document.getElementById('modalBody').innerHTML=`
    ${img}
    <div class="modal-tags">
      <span class="badge ${badgeClass(s.type)}">${s.type}</span>
      <span class="tag-thc">THC: ${s.thc}</span>
      ${tried?`<span class="tag-tried">✓ Probada</span>`:''}
    </div>
    <p class="modal-desc">${s.desc}</p>
    <p class="section-label">Efectos</p>
    <div class="effects">${s.effects.map(e=>`<span class="effect">${e}</span>`).join('')}</div>
    <button class="upload-btn" onclick="document.getElementById('photoInput').click()">
      <i class="ti ti-camera"></i> ${u.photo?'Cambiar foto':'Agregar tu foto'}
    </button>
    <div class="rating-row">
      <label>Tu valoración:</label>
      ${[1,2,3,4,5].map(n=>`<span class="star${n<=stars?' on':''}" onclick="setRating(${n})">⭐</span>`).join('')}
    </div>
    <label class="notes-label">Notas personales</label>
    <textarea id="notesInput" placeholder="¿Cómo fue? ¿Dónde la conseguiste?">${u.notes||''}</textarea>
    <div class="modal-actions">
      <button class="btn-primary${tried?' untry':''}" onclick="toggleTried(${s.id})">
        <i class="ti ${tried?'ti-circle-minus':'ti-circle-check'}"></i>
        ${tried?'Marcar sin probar':'Marcar como probada'}
      </button>
      <button class="btn-sec" onclick="saveEntry(${s.id})">Guardar</button>
    </div>`;
}

function setRating(n){
  if(!currentStrain)return;
  const u=userData[currentStrain.id]||{};u.rating=n;userData[currentStrain.id]=u;
  document.querySelectorAll('.star').forEach((el,i)=>el.classList.toggle('on',i<n));
}
function toggleTried(id){const u=userData[id]||{};u.tried=!u.tried;userData[id]=u;save();renderGrid();openModal(id);}
function saveEntry(id){
  const u=userData[id]||{};u.notes=document.getElementById('notesInput').value;
  if(pendingPhoto)u.photo=pendingPhoto;userData[id]=u;save();renderGrid();
  renderModalBody(STRAINS.find(s=>s.id===id),u);
}
function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{pendingPhoto=ev.target.result;if(currentStrain)renderModalBody(currentStrain,{...userData[currentStrain.id]||{},photo:pendingPhoto});};
  r.readAsDataURL(f);e.target.value='';
}
function closeModal(){document.getElementById('overlay').classList.remove('open');currentStrain=null;pendingPhoto=null;}
function closeOverlay(e){if(e.target===document.getElementById('overlay'))closeModal();}
function setTab(el,tab){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderGrid();}
document.getElementById('searchInput').addEventListener('input',e=>{currentSearch=e.target.value.trim();renderGrid();});
document.getElementById('typeFilter').addEventListener('change',e=>{currentType=e.target.value;renderGrid();});
renderGrid();
</script>
